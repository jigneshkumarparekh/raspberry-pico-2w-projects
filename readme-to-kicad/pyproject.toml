[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readme-to-kicad"
version = "0.1.0"
description = "Generate KiCad schematic files from README wiring descriptions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
readme-to-kicad = "readme_to_kicad.cli:main"

[tool.setuptools.package-data]
readme_to_kicad = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
